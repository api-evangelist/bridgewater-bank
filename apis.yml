name: Bridgewater Bank
kind: company
description: Bridgewater Bank is a Canadian Schedule I chartered bank, a wholly-owned
  subsidiary of the Alberta Motor Association (AMA), headquartered in Calgary, Alberta
  and established in 1997. It is a member of the Canada Deposit Insurance Corporation
  (CDIC) and operates a broker-distributed, deposit-and-lending model rather than a
  direct-to-consumer retail branch network — residential mortgages, Guaranteed Investment
  Certificates (GICs), and high-interest savings accounts sold through a select network
  of trusted mortgage and deposit brokers, with roughly $3.3 billion in mortgages and
  deposits across approximately 53,000 customer accounts nationwide. Bridgewater Bank
  exposes NO public first-party developer API or developer portal. Its only dedicated
  digital surface beyond the corporate site is a partner-gated broker information portal
  (bwbbrokerinfo.ca). Canada's Consumer-Driven Banking (open-banking) framework is
  legislated but not yet operational, so any consumer data access from a bank of this
  size is voluntary and today would be aggregator/screen-scraping based rather than
  through a documented first-party API. No Interac, Real-Time Rail (RTR), FDX, or
  consumer-driven-banking API participation is publicly documented by the institution.
